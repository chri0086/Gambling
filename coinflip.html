<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip - Casino</title>
  <style>
    :root { --bg:#0f1923; --panel:#1a2c38; --muted:#9aa4b2; --text:#e6edf3; --accent:#00e701; --accent-2:#00b929; --danger:#ff003f; --ok:#00e701; --gold:#ffc800; }
    *{box-sizing:border-box}
    html, body { height: 100%; }
    body { margin:0; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f1923; color: var(--text); }
    body.reduce-motion * { animation: none !important; transition: none !important; }

    .topbar { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.05); background: #1a2c38; position: sticky; top: 0; backdrop-filter: blur(6px); z-index:100; }
    .brand { font-weight:800; display:flex; align-items:center; gap:8px; font-size:18px; }
    .brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent) }
    .nav { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .nav a { color: var(--muted); text-decoration:none; padding:8px 12px; border-radius:8px; transition: all 0.2s; font-size:14px; font-weight:500; }
    .nav a:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .nav a.active { background: rgba(0,231,1,.08); color: var(--accent); font-weight:700; }
    .balance { display:flex; align-items:center; gap:10px; background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); padding:6px 10px; border-radius:8px; }
    .balance .amount { color: var(--gold); font-weight:800; font-size:16px; }

    main { padding: 20px; display:grid; grid-template-columns: 320px 1fr; gap:20px; position: relative; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
    .panel { background: #1a2c38; border:1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; }
    .panel h3 { margin:0 0 16px 0; font-size:16px; color: var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
    .controls { display:flex; flex-direction:column; gap: 16px; }
    .control-group { display:flex; flex-direction:column; gap:8px; }
    .control-group label { color: var(--muted); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
    .input { background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color: var(--text); padding:12px 14px; border-radius:8px; font-size:15px; font-weight:600; transition: all 0.2s; width:100%; }
    .input:focus { outline:none; border-color: var(--accent); background: rgba(0,0,0,0.4); }
    .btn { background: var(--accent); color:#000; border: none; padding: 14px 18px; border-radius:8px; font-weight:700; cursor:pointer; transition: all 0.2s; font-size:15px; text-transform:uppercase; letter-spacing:0.5px; }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: translateY(0px); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform: none; }
    .btn.danger { background: var(--danger); }
    .btn.secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,.1); color: var(--text); font-size:13px; padding:6px 12px; }
    .btn.secondary:hover { background: rgba(255,255,255,0.08); }
    .btn.ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,.1); color: var(--text); }
    .btn.ghost:hover { background: rgba(255,255,255,0.08); }
    .muted { color: var(--muted); font-size:13px; }
    .msg { min-height:24px; font-weight:700; font-size:14px; padding:8px; border-radius:6px; text-align:center; }
    .msg.win { background: rgba(0,231,1,.1); color: var(--accent); }
    .msg.lose { background: rgba(255,0,63,.1); color: var(--danger); }

    .quick-bets { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
    .quick-bets .btn { padding:10px; font-size:13px; }

    .stats-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .stats-row:last-child { border-bottom:none; }
    .stats-label { color: var(--muted); font-size:13px; }
    .stats-value { color: var(--text); font-weight:700; font-size:14px; }

    .amount.flash-up { animation: amtUp 750ms ease-out; }
    .amount.flash-down { animation: amtDown 750ms ease-out; }
    @keyframes amtUp { 0%{ color:#fff } 20%{ color:#00e701; transform: scale(1.08) } 100%{ color: var(--gold); transform: scale(1) } }
    @keyframes amtDown { 0%{ color:#fff } 20%{ color:#ff003f; transform: scale(0.96) } 100%{ color: var(--gold); transform: scale(1) } }

    .coin-container { display:flex; justify-content:center; align-items:center; min-height:300px; perspective: 1000px; }
    .coin { width: 180px; height: 180px; position: relative; transform-style: preserve-3d; transition: transform 1s; }
    .coin.flipping { animation: flip 1s ease-out; }
    @keyframes flip {
      0% { transform: rotateY(0deg) rotateX(0deg); }
      100% { transform: rotateY(1800deg) rotateX(360deg); }
    }
    .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 800; border: 4px solid var(--gold); box-shadow: 0 8px 32px rgba(255,200,0,0.4); }
    .coin-heads { background: linear-gradient(135deg, #ffd700, #ffed4e); color: #000; }
    .coin-tails { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #000; transform: rotateY(180deg); }
    .coin.show-heads { transform: rotateY(0deg); }
    .coin.show-tails { transform: rotateY(180deg); }

    .choice-buttons { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:20px; }
    .choice-btn { padding:20px; border-radius:12px; border:3px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); cursor:pointer; font-weight:800; font-size:18px; transition: all 0.3s; text-align:center; color: var(--muted); display:flex; flex-direction:column; gap:8px; align-items:center; }
    .choice-btn:hover { background:rgba(255,255,255,.06); transform: translateY(-2px); }
    .choice-btn.selected { background:rgba(0,231,1,.12); color: var(--accent); border-color: var(--accent); }
    .choice-btn .icon { font-size:48px; }
    .choice-btn .label { font-size:16px; text-transform:uppercase; letter-spacing:1px; }

    .odds-info { background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:16px; margin-bottom:16px; text-align:center; }
    .odds-info .odds { font-size:24px; font-weight:800; color: var(--accent); }
    .odds-info .label { font-size:13px; color: var(--muted); margin-top:4px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Casino</span>
    </div>
    <nav class="nav">
      <a href="home.html">🏠 Home</a>
      <a href="index.html">♠️ Blackjack</a>
      <a href="roulette.html">🎡 Roulette</a>
      <a href="slots.html">🎰 Slots</a>
      <a href="dice.html">🎲 Dice</a>
      <a href="crash.html">🚀 Crash</a>
      <a href="plinko.html">🔻 Plinko</a>
      <a href="coinflip.html" class="active">🪙 Coin Flip</a>
    </nav>
    <div class="balance">
      <span>Guthaben:</span>
      <span class="amount" id="bankroll">$1,000</span>
      <button class="btn secondary" id="reset-bank">Reset</button>
      <button class="btn secondary" id="mute-toggle" aria-pressed="false" title="Ton an/aus">🔊</button>
      <button class="btn ghost" id="motion-toggle" title="Animationen reduzieren">⚡</button>
    </div>
  </header>
  <main>
    <aside class="panel">
      <h3>Einstellungen</h3>
      <div class="controls">
        <div class="control-group">
          <label>Einsatz ($)</label>
          <input type="number" id="bet-input" class="input" value="10" min="1" step="1"/>
        </div>
        <div class="quick-bets">
          <button class="btn ghost" data-qb="half">½</button>
          <button class="btn ghost" data-qb="double">2×</button>
          <button class="btn ghost" data-qb="-5">-5</button>
          <button class="btn ghost" data-qb="+5">+5</button>
        </div>
        <div class="control-group">
          <label>Wähle deine Seite</label>
          <div class="choice-buttons">
            <div class="choice-btn selected" data-choice="heads">
              <span class="icon">👑</span>
              <span class="label">Kopf</span>
            </div>
            <div class="choice-btn" data-choice="tails">
              <span class="icon">🔰</span>
              <span class="label">Zahl</span>
            </div>
          </div>
        </div>
        <button class="btn" id="flip-btn" style="width:100%">🪙 Flip Coin</button>
      </div>
      <div style="margin-top:24px">
        <h3>Session Stats</h3>
        <div class="stats-row">
          <span class="stats-label">Flips</span>
          <span class="stats-value" id="stat-flips">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Gewonnen</span>
          <span class="stats-value" id="stat-wins">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Win Rate</span>
          <span class="stats-value" id="stat-winrate">0%</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Profit</span>
          <span class="stats-value" id="stat-profit">$0</span>
        </div>
      </div>
    </aside>
    <section class="panel">
      <div class="odds-info">
        <div class="odds">2.00× Auszahlung</div>
        <div class="label">Fair 50/50 Odds - Keine House Edge!</div>
      </div>
      <div class="coin-container">
        <div class="coin" id="coin">
          <div class="coin-face coin-heads">👑</div>
          <div class="coin-face coin-tails">🔰</div>
        </div>
      </div>
      <div class="msg" id="game-msg"></div>
    </section>
  </main>
  <script src="casino-addictive.js"></script>
  <script>
    'use strict';
    const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s)); const fmt=(n)=>`$${Number(n).toLocaleString()}`;
    const BANK_KEY='casino_bankroll_v1'; const START_BANK=1000; let bankroll=loadBank(); const bankrollEl=$('#bankroll');
    const BUS = ('BroadcastChannel' in window) ? new BroadcastChannel('casino_bankroll_bus') : null;
    function loadBank(){ try{ const n=Number(localStorage.getItem(BANK_KEY)); if(Number.isFinite(n)&&n>=0) return Math.floor(n);}catch{} return START_BANK; }
    function saveBank(){ try{ localStorage.setItem(BANK_KEY, String(bankroll)); }catch{} }
    function updateBankEl(){ bankrollEl.textContent = fmt(bankroll); }
    function broadcastBank(){ try{ BUS && BUS.postMessage({ t:'bank', v: bankroll }); }catch{} }
    function credit(delta){ bankroll=Math.max(0, bankroll+delta); updateBankEl(); bankrollEl.classList.remove('flash-up','flash-down'); void bankrollEl.offsetWidth; bankrollEl.classList.add(delta>=0?'flash-up':'flash-down'); saveBank(); broadcastBank(); }
    window.addEventListener('storage', (e)=>{ if(e.key===BANK_KEY){ const n=Number(e.newValue||''); if(Number.isFinite(n)){ bankroll = Math.max(0, Math.floor(n)); updateBankEl(); } } });
    if(BUS){ BUS.addEventListener('message', (ev)=>{ const d=ev.data; if(d && d.t==='bank'){ const n=Number(d.v); if(Number.isFinite(n) && n!==bankroll){ bankroll = Math.max(0, Math.floor(n)); updateBankEl(); } } }); }
    credit(0);
    $('#reset-bank').addEventListener('click', ()=>{ bankroll=START_BANK; credit(0); });
    $('#motion-toggle').addEventListener('click', ()=>{ document.body.classList.toggle('reduce-motion'); });

    const MUTE_KEY='casino_mute_v1'; const MuteBtn=$('#mute-toggle');
    const Sound=(()=>{ let ctx=null; let muted=(function(){ try{ return localStorage.getItem(MUTE_KEY)==='1'; }catch{} return false; })(); function saveMute(){ try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch{} } function ensure(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; try{ ctx=new AC(); }catch{} } } function envGain(g){ const gain=ctx.createGain(); gain.gain.value=g; gain.connect(ctx.destination); return gain; } function tone(f=440,d=0.12,t='sine',v=0.05){ if(muted||!ctx) return; const o=ctx.createOscillator(); const g=envGain(v); o.type=t; o.frequency.value=f; o.connect(g); const tt=ctx.currentTime; o.start(tt); o.stop(tt+d); } function click(){ tone(660,0.06,'square',0.03) } function win(){ tone(880,0.1,'sine',0.06); setTimeout(()=>tone(1320,0.12,'sine',0.06),90)} function lose(){ tone(220,0.18,'sawtooth',0.05) } function update(){ MuteBtn.setAttribute('aria-pressed', muted?'true':'false'); MuteBtn.textContent = muted?'🔇':'🔊'; } update(); return { toggle(){ ensure(); muted=!muted; saveMute(); update(); }, play(n){ ensure(); if(muted) return; if(n==='click') click(); else if(n==='win') win(); else if(n==='lose') lose(); } }; })();
    MuteBtn.addEventListener('click', ()=>Sound.toggle());

    // Coin Flip Game Logic
    const betIn=$('#bet-input'), flipBtn=$('#flip-btn'), msg=$('#game-msg'), coin=$('#coin');
    const statFlips=$('#stat-flips'), statWins=$('#stat-wins'), statWinrate=$('#stat-winrate'), statProfit=$('#stat-profit');
    const choiceBtns=$$('.choice-btn'), quickBtns=$$('.quick-bets .btn');

    let selectedChoice='heads', sessionFlips=0, sessionWins=0, sessionProfit=0, isFlipping=false;

    // Quick bet buttons
    quickBtns.forEach(b=> b.addEventListener('click',()=>{
      const k=b.getAttribute('data-qb');
      let v=Math.max(1, Number(betIn.value)||0);
      if(k==='-5') v=Math.max(1, v-5);
      else if(k==='+5') v+=5;
      else if(k==='half') v=Math.max(1, Math.floor(v/2));
      else if(k==='double') v*=2;
      v=Math.max(1, Math.min(v, bankroll));
      betIn.value=v;
      Sound.play('click');
    }));

    // Choice selection
    choiceBtns.forEach(b=> b.addEventListener('click',()=>{
      if(isFlipping) return;
      choiceBtns.forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      selectedChoice = b.getAttribute('data-choice');
      Sound.play('click');
    }));

    // Flip button
    flipBtn.addEventListener('click', flipCoin);

    function flipCoin(){
      if(isFlipping) return;

      const bet = Math.max(1, Number(betIn.value)||0);
      if(bet > bankroll){
        msg.textContent='Zu wenig Guthaben.';
        msg.className='msg lose';
        return;
      }

      isFlipping = true;
      credit(-bet);
      flipBtn.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';

      // Use cryptographically secure random if available, fallback to Math.random
      // This ensures truly fair 50/50 odds
      let result;
      if(window.crypto && window.crypto.getRandomValues){
        const randomBuffer = new Uint32Array(1);
        window.crypto.getRandomValues(randomBuffer);
        result = randomBuffer[0] % 2 === 0 ? 'heads' : 'tails';
      } else {
        result = Math.random() < 0.5 ? 'heads' : 'tails';
      }

      // Animate coin flip
      coin.classList.remove('show-heads', 'show-tails');
      coin.classList.add('flipping');
      Sound.play('click');

      setTimeout(() => {
        coin.classList.remove('flipping');
        coin.classList.add(result === 'heads' ? 'show-heads' : 'show-tails');

        sessionFlips++;

        // Check if player won
        if(result === selectedChoice){
          // Win! Fair 2x payout (no house edge)
          const payout = bet * 2;
          credit(payout);
          sessionWins++;
          sessionProfit += bet;

          msg.textContent = `🎉 ${result === 'heads' ? 'Kopf' : 'Zahl'}! Gewonnen ${fmt(bet)}! (Auszahlung ${fmt(payout)})`;
          msg.className = 'msg win';
          Sound.play('win');

          if(window.CasinoAddictive){
            CasinoAddictive.Streak.win();
            CasinoAddictive.Level.addXP(bet);
            CasinoAddictive.Stats.recordWin(payout, bet);
            CasinoAddictive.Stats.recordBet(bet);
          }
        } else {
          // Lost
          sessionProfit -= bet;

          msg.textContent = `${result === 'heads' ? '👑 Kopf' : '🔰 Zahl'} - Verloren ${fmt(bet)}`;
          msg.className = 'msg lose';
          Sound.play('lose');

          if(window.CasinoAddictive){
            CasinoAddictive.Streak.lose();
            CasinoAddictive.Stats.recordLoss(bet);
            CasinoAddictive.Stats.recordBet(bet);
          }
        }

        updateStats();
        isFlipping = false;
        flipBtn.disabled = false;
      }, 1000);
    }

    function updateStats(){
      statFlips.textContent = sessionFlips;
      statWins.textContent = sessionWins;
      statWinrate.textContent = sessionFlips > 0 ? Math.round(sessionWins/sessionFlips*100)+'%' : '0%';
      statProfit.textContent = sessionProfit >= 0 ? '+'+fmt(sessionProfit) : '-'+fmt(Math.abs(sessionProfit));
    }

    // Initialize coin to show heads
    coin.classList.add('show-heads');
  </script>
</body>
</html>
