<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slots</title>
    <style>
      :root { --bg:#0a0f12; --panel:#0e1520; --muted:#9aa4b2; --text:#e6edf3; --accent:#22d3ee; --accent-2:#0ea5e9; --danger:#ef4444; --ok:#10b981; --gold:#ffd166; }
      *{box-sizing:border-box}
      html, body { height: 100%; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: radial-gradient(1200px 800px at 50% -10%, #0e1b2a, #081018 60%, #050a10 100%); color: var(--text); }
      body.reduce-motion * { animation: none !important; transition: none !important; }

      .topbar { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.06); background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)); position: sticky; top: 0; backdrop-filter: blur(6px); }
      .brand { font-weight:800; display:flex; align-items:center; gap:8px }
      .brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent) }
      .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .nav a { color: var(--text); text-decoration:none; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
      .nav a:hover { background: rgba(255,255,255,.06); }
      .nav a.active { background: linear-gradient(180deg, rgba(34,211,238,.15), rgba(14,165,233,.1)); border-color: rgba(34,211,238,.25); }
      .balance { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:12px; }
      .balance .amount { color: var(--gold); font-weight:800; }

      main { padding: 16px; display:grid; gap:16px; position: relative; max-width: 900px; margin: 0 auto; }
      .panel { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; }
      .controls { display:flex; gap: 10px; flex-wrap:wrap; align-items:center }
      .input { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); color: var(--text); padding:8px 10px; border-radius:10px }
      .btn { background: var(--accent-2); color:#001018; border: none; padding: 10px 14px; border-radius:10px; font-weight:700; cursor:pointer; box-shadow: 0 6px 16px rgba(14,165,233,.35) }
      .btn:hover { filter: brightness(1.06) }
      .btn:disabled { opacity:.5; cursor:not-allowed }
      .btn.gold { background: linear-gradient(180deg, #ffd166, #ffb703); color: #1f2937; box-shadow: 0 6px 16px rgba(255,183,3,.25) }
      .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.12); color: var(--text); }
      .muted { color: var(--muted); }
      .msg { min-height:20px; font-weight:700 }
      .badge { padding:2px 8px; border-radius:999px; background: rgba(255,255,255,0.08); font-size:12px }

      .reels { display:grid; grid-template-columns: repeat(3, 80px); gap:10px; padding:12px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px; width:max-content }
      .reel { width:80px; height:80px; display:grid; place-items:center; font-size:36px; background: rgba(0,0,0,0.2); border-radius:10px; }
      .win { outline: 2px solid rgba(255,255,255,.25); box-shadow: 0 0 20px rgba(255,255,255,.25) inset; }
      .blur { filter: blur(2px) brightness(1.05); }

      /* balance flash */
      .amount.flash-up { animation: amtUp 750ms ease-out; }
      .amount.flash-down { animation: amtDown 750ms ease-out; }
      @keyframes amtUp { 0%{ color:#fff } 20%{ color:#10b981; transform: scale(1.08) } 100%{ color: var(--gold); transform: scale(1) } }
      @keyframes amtDown { 0%{ color:#fff } 20%{ color:#ef4444; transform: scale(0.96) } 100%{ color: var(--gold); transform: scale(1) } }

      #fx-canvas{ position:absolute; inset:0; pointer-events:none }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="dot"></span> <span>Slots</span></div>
      <nav class="nav">
        <a href="index.html">Blackjack</a>
        <a href="roulette.html">Roulette</a>
        <a href="slots.html" class="active">Slots</a>
        <a href="dice.html">Dice</a>
        <a href="crash.html">Crash</a>
      </nav>
      <div class="balance">
        <span>Guthaben:</span>
        <span class="amount" id="bankroll">$1,000</span>
        <button class="btn" id="reset-bank">Reset</button>
        <button class="btn" id="mute-toggle" aria-pressed="false" title="Ton an/aus">🔊</button>
        <button class="btn ghost" id="motion-toggle" title="Animationen reduzieren">Motion</button>
      </div>
    </header>
    <main>
      <section class="panel" id="game-slots">
        <h3>Slots</h3>
        <div class="controls">
          <label>Einsatz ($): <input type="number" id="sl-bet" class="input" value="5" min="1" step="1"/></label>
          <button class="btn gold" id="sl-spin">Spin</button>
        </div>
        <div class="reels" id="sl-reels">
          <div class="reel">🍒</div>
          <div class="reel">🍒</div>
          <div class="reel">🍒</div>
          <div class="reel">🍋</div>
          <div class="reel">🍋</div>
          <div class="reel">🍋</div>
          <div class="reel">⭐</div>
          <div class="reel">⭐</div>
          <div class="reel">⭐</div>
        </div>
        <div class="msg" id="sl-msg"></div>
        <div class="muted">Gewinnlinien: 3 horizontale Reihen. Auszahlungen: 7️⃣ x10, ⭐ x5, 🔔 x3, 🍒/🍋 x2</div>
      </section>
      <canvas id="fx-canvas"></canvas>
    </main>
    <script>
      'use strict';
      const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s)); const fmt=(n)=>`$${Number(n).toLocaleString()}`;
      const BANK_KEY='casino_bankroll_v1'; const START_BANK=1000; let bankroll=loadBank(); const bankrollEl=$('#bankroll');
      function loadBank(){ try{ const n=Number(localStorage.getItem(BANK_KEY)); if(Number.isFinite(n)&&n>=0) return Math.floor(n);}catch{} return START_BANK; }
      function saveBank(){ try{ localStorage.setItem(BANK_KEY, String(bankroll)); }catch{} }
      function credit(delta){ bankroll=Math.max(0, bankroll+delta); bankrollEl.textContent=fmt(bankroll); bankrollEl.classList.remove('flash-up','flash-down'); void bankrollEl.offsetWidth; bankrollEl.classList.add(delta>=0?'flash-up':'flash-down'); saveBank(); }
      credit(0);
      $('#reset-bank').addEventListener('click', ()=>{ bankroll=START_BANK; credit(0); Sound.play('click'); });
      $('#motion-toggle').addEventListener('click', ()=>{ document.body.classList.toggle('reduce-motion'); });

      const MUTE_KEY='casino_mute_v1'; const MuteBtn=$('#mute-toggle');
      const Sound=(()=>{ let ctx=null; let muted=(function(){ try{ return localStorage.getItem(MUTE_KEY)==='1'; }catch{} return false; })(); function saveMute(){ try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch{} } function ensure(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; try{ ctx=new AC(); }catch{} } } function envGain(g){ const gain=ctx.createGain(); gain.gain.value=g; gain.connect(ctx.destination); return gain; } function tone(f=440,d=0.12,t='sine',v=0.05){ if(muted||!ctx) return; const o=ctx.createOscillator(); const g=envGain(v); o.type=t; o.frequency.value=f; o.connect(g); const tt=ctx.currentTime; o.start(tt); o.stop(tt+d); } function click(){ tone(660,0.06,'square',0.03) } function win(){ tone(880,0.1,'sine',0.06); setTimeout(()=>tone(1320,0.12,'sine',0.06),90)} function lose(){ tone(220,0.18,'sawtooth',0.05) } function update(){ MuteBtn.setAttribute('aria-pressed', muted?'true':'false'); MuteBtn.textContent = muted?'🔇':'🔊'; } update(); return { toggle(){ ensure(); muted=!muted; saveMute(); update(); }, play(n){ ensure(); if(muted) return; if(n==='click') click(); else if(n==='win') win(); else if(n==='lose') lose(); } }; })();
      MuteBtn.addEventListener('click', ()=>Sound.toggle());

      const fxCanvas=$('#fx-canvas');
      const FX=(()=>{ const ctx=fxCanvas.getContext('2d'); let ps=[]; let running=false; let raf=0; function resize(){ const r=fxCanvas.getBoundingClientRect(); fxCanvas.width=Math.floor(r.width*devicePixelRatio); fxCanvas.height=Math.floor(r.height*devicePixelRatio);} window.addEventListener('resize',resize); resize(); function randColor(){ const cs=['#22d3ee','#0ea5e9','#10b981','#f59e0b','#ef4444','#eab308','#a78bfa','#f472b6']; return cs[Math.floor(Math.random()*cs.length)]; } function spawn(n=120){ const w=fxCanvas.width,h=fxCanvas.height; for(let i=0;i<n;i++){ ps.push({ x=w/2+(Math.random()*w/3-w/6), y:-20*devicePixelRatio, vx:(Math.random()-0.5)*3*devicePixelRatio, vy:(2+Math.random()*2)*devicePixelRatio, g:0.08*devicePixelRatio, s:(2+Math.random()*3)*devicePixelRatio, c:randColor(), a:1, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2 }); } } function step(){ if(!running) return; const w=fxCanvas.width,h=fxCanvas.height; ctx.clearRect(0,0,w,h); ps.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a=Math.max(0,p.a-0.005); ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s); ctx.restore(); }); ps=ps.filter(p=>p.y<h+40&&p.a>0.01); if(ps.length===0){ running=false; cancelAnimationFrame(raf); ctx.clearRect(0,0,w,h); return; } raf=requestAnimationFrame(step);} function burst(intensity=1){ resize(); spawn(Math.floor(120*intensity)); if(!running){ running=true; step(); } } return { burst }; })();

      // Slots logic
      const betIn=$('#sl-bet'); const spinBtn=$('#sl-spin'); const reelsEl=$('#sl-reels'); const msg=$('#sl-msg');
      const SYM=['🍒','🔔','🍋','⭐','7️⃣'];
      function randSym(){ return SYM[Math.floor(Math.random()*SYM.length)]; }
      function spinGrid(){ return Array.from({length:3}, ()=> Array.from({length:3}, ()=> randSym())); }
      function payout(line){ if(line.every(x=>x==='7️⃣')) return 10; if(line.every(x=>x==='⭐')) return 5; if(line.every(x=>x==='🔔')) return 3; if(line.every(x=>x==='🍒')||line.every(x=>x==='🍋')) return 2; return 0; }
      function highlightWins(grid){ const cells=[...reelsEl.querySelectorAll('.reel')]; const rows=[[0,1,2],[3,4,5],[6,7,8]]; rows.forEach((idxs,ri)=>{ const line=grid[ri]; const mult=payout(line); if(mult>0){ idxs.forEach(i=>cells[i].classList.add('win')); setTimeout(()=>idxs.forEach(i=>cells[i].classList.remove('win')), 1000); } }); }
      function animateSpin(finalGrid, bet){ const cells=[...reelsEl.querySelectorAll('.reel')];
        cells.forEach(c=>c.classList.add('blur'));
        spinBtn.disabled=true; betIn.disabled=true; msg.textContent='Dreht…';
        const colStops=[700,1000,1300];
        for(let col=0; col<3; col++){
          const colIdx=[col, col+3, col+6];
          const t=setInterval(()=>{ colIdx.forEach(i=>{ cells[i].textContent=randSym(); }); }, 60);
          setTimeout(()=>{ clearInterval(t); for(let r=0;r<3;r++){ const i=colIdx[r]; cells[i].textContent=finalGrid[r][col]; }
            if(col===2){ cells.forEach(c=>c.classList.remove('blur')); const lines=[finalGrid[0],finalGrid[1],finalGrid[2]]; let mult=0; lines.forEach(l=>mult+=payout(l)); const win=bet*mult; if(win>0){ credit(win); msg.textContent='Gewinn '+fmt(win-bet)+' (x'+mult+')'; highlightWins(finalGrid); Sound.play('win'); if(mult>=5) FX.burst(1.0); } else { msg.textContent='Keine Linie – Verlust.'; Sound.play('lose'); } spinBtn.disabled=false; betIn.disabled=false; }
          }, colStops[col]);
        }
      }
      function getBet(){ const n = Math.floor(Number(betIn.value)); return Number.isFinite(n) && n>0 ? n : 1; }
      spinBtn.addEventListener('click', ()=>{
        if(spinBtn.disabled) return;
        let bet = getBet();
        if(bet>bankroll){
          if(bankroll===0){ bankroll = START_BANK; credit(0); msg.textContent = 'Guthaben aufgefüllt: '+fmt(START_BANK); }
          else { msg.textContent='Zu wenig Guthaben.'; return; }
        }
        credit(-bet); Sound.play('click');
        const grid=spinGrid(); animateSpin(grid, bet);
      });
    </script>
  </body>
</html>
