<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roulette</title>
    <style>
      :root { --bg:#0a0f12; --panel:#0e1520; --muted:#9aa4b2; --text:#e6edf3; --accent:#22d3ee; --accent-2:#0ea5e9; --danger:#ef4444; --ok:#10b981; --gold:#ffd166; }
      *{box-sizing:border-box}
  html, body { height:100%; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: radial-gradient(1200px 800px at 50% -10%, #0e1b2a, #081018 60%, #050a10 100%); color: var(--text); min-height:100vh; display:flex; flex-direction:column; }
      body.reduce-motion * { animation: none !important; transition: none !important; }

      .topbar { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.06); background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)); position: sticky; top: 0; backdrop-filter: blur(6px); }
      .brand { font-weight:800; display:flex; align-items:center; gap:8px }
      .brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent) }
      .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .nav a { color: var(--text); text-decoration:none; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
      .nav a:hover { background: rgba(255,255,255,.06); }
      .nav a.active { background: linear-gradient(180deg, rgba(34,211,238,.15), rgba(14,165,233,.1)); border-color: rgba(34,211,238,.25); }
      .balance { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:12px; }
      .balance .amount { color: var(--gold); font-weight:800; }

  main { padding:16px; display:flex; flex-direction:column; gap:16px; position:relative; width:100%; max-width:none; margin:0; flex:1; }
  .panel { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:16px; margin-left:0; flex:1; display:flex; flex-direction:column; }
      .controls { display:flex; gap: 10px; flex-wrap:wrap; align-items:center }
      .input { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); color: var(--text); padding:8px 10px; border-radius:10px }
      .btn { background: var(--accent-2); color:#001018; border: none; padding: 10px 14px; border-radius:10px; font-weight:700; cursor:pointer; box-shadow: 0 6px 16px rgba(14,165,233,.35) }
      .btn:hover { filter: brightness(1.06) }
      .btn:disabled { opacity:.5; cursor:not-allowed }
      .btn.gold { background: linear-gradient(180deg, #ffd166, #ffb703); color: #1f2937; box-shadow: 0 6px 16px rgba(255,183,3,.25) }
      .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.12); color: var(--text); }
      .muted { color: var(--muted); }
      .msg { min-height:20px; font-weight:700 }
      .badge { padding:2px 8px; border-radius:999px; background: rgba(255,255,255,0.08); font-size:12px }

      .roulette-out { display:flex; align-items:center; gap:16px }
      .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent-2); animation: spin 900ms linear infinite }
      @keyframes spin { to { transform: rotate(360deg) } }
      .hide { display:none !important }

      /* balance flash and pop-in */
      .amount.flash-up { animation: amtUp 750ms ease-out; }
      .amount.flash-down { animation: amtDown 750ms ease-out; }
      @keyframes amtUp { 0%{ color:#fff } 20%{ color:#10b981; transform: scale(1.08) } 100%{ color: var(--gold); transform: scale(1) } }
      @keyframes amtDown { 0%{ color:#fff } 20%{ color:#ef4444; transform: scale(0.96) } 100%{ color: var(--gold); transform: scale(1) } }
      @keyframes popIn { 0%{ transform: scale(.8); opacity:.2 } 60%{ transform: scale(1.08); opacity:1 } 100%{ transform: scale(1) } }
      .pop { animation: popIn 350ms ease-out; }

      #fx-canvas{ position:absolute; inset:0; pointer-events:none }

    /* --- Betting Mat Only --- */
  .roulette-layout { display:grid; grid-template-columns: 1fr 360px; gap:24px; margin-top:14px; flex:1; align-items:start; }
  @media (max-width: 980px){ .roulette-layout { grid-template-columns:1fr; } .wheel-side{order:-1;} }
  /* Force betting area left alignment */
  .betting-area { width:100%; }

  /* Betting mat (restored) */
  .betting-area { display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; }
  .chip-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .chip-btn { position:relative; width: 42px; height: 42px; border-radius:50%; border:2px dashed rgba(255,255,255,.4); background: radial-gradient(circle at 35% 35%, #ffd166, #f59e0b); color:#1f2937; font-weight:800; cursor:pointer; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .chip-btn[data-chip="5"]{ background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b); }
  .chip-btn[data-chip="10"]{ background: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6); }
  .chip-btn[data-chip="25"]{ background: radial-gradient(circle at 35% 35%, #86efac, #10b981); }
  .chip-btn[data-chip="100"]{ background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444); color:#0b0f16 }
  .chip-btn.active { outline:3px solid var(--accent-2); }
  .betting-mat { display:grid; grid-template-columns: 80px repeat(12, minmax(60px, 1fr)); gap:4px; background: linear-gradient(180deg, rgba(16,24,35,.9), rgba(8,12,20,.9)); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; width:100%; flex:1; overflow:auto; }
  .cell { position:relative; min-height:52px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.1); border-radius:8px; color:#e5e7eb; font-weight:800; cursor:pointer; user-select:none; background: rgba(255,255,255,.02); font-size:14px; }
  .cell.zero { grid-row: 1 / span 3; background: rgba(16,185,129,.35); border-color: rgba(16,185,129,.55); }
  .cell.red { background: rgba(239,68,68,.28); }
  .cell.black { background: rgba(17,24,39,.7); }
  .cell:hover { filter: brightness(1.15); }
  .outside { background: rgba(255,255,255,.05); font-weight:700; }
  .stack { position:absolute; bottom:4px; right:6px; background: rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:2px 6px; font-size:12px }
  .chip { position:absolute; top:50%; left:50%; transform: translate(-50%,-50%); width:32px; height:32px; border-radius:50%; border:2px dashed rgba(255,255,255,.6); background: radial-gradient(circle at 35% 35%, #ffd166, #f59e0b); color:#1f2937; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center; pointer-events:none; box-shadow: 0 8px 16px rgba(0,0,0,.35) }
  .chip.small { width:26px; height:26px; font-size:11px }
  .mat-caption { color: var(--muted); font-size:12px }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="dot"></span> <span>Roulette</span></div>
      <nav class="nav">
        <a href="index.html">Blackjack</a>
        <a href="roulette.html" class="active">Roulette</a>
        <a href="slots.html">Slots</a>
        <a href="dice.html">Dice</a>
        <a href="crash.html">Crash</a>
      </nav>
      <div class="balance">
        <span>Guthaben:</span>
        <span class="amount" id="bankroll">$1,000</span>
        <button class="btn" id="reset-bank">Reset</button>
        <button class="btn" id="mute-toggle" aria-pressed="false" title="Ton an/aus">🔊</button>
        <button class="btn ghost" id="motion-toggle" title="Animationen reduzieren">Motion</button>
      </div>
    </header>
    <main>
      <section class="panel" id="game-roulette">
        <h3>Roulette</h3>
        <div class="controls">
          <label>Wette ($): <input type="number" id="rl-bet" class="input" value="5" min="1" step="1" /></label>
          <label>Typ:
            <select id="rl-type" class="input">
              <option value="red">Rot (x2)</option>
              <option value="black">Schwarz (x2)</option>
              <option value="odd">Ungerade (x2)</option>
              <option value="even">Gerade (x2)</option>
              <option value="number">Zahl (x36)</option>
            </select>
          </label>
          <label id="rl-number-wrap" hidden>Zahl (0–36): <input type="number" id="rl-number" class="input" value="7" min="0" max="36"/></label>
          <button class="btn gold" id="rl-spin">Drehen</button>
        </div>
        <div class="roulette-out">
          <div id="rl-wheel" class="spinner hide"></div>
          <div>Ergebnis: <span class="badge" id="rl-result">–</span></div>
          <div class="muted">Farbe: <span id="rl-color">–</span></div>
        </div>
        <div class="msg" id="rl-msg"></div>
        <div class="muted">Einfaches Demo-Roulette. Kein echtes Geld.</div>
        
        <div class="roulette-layout">
          <div class="betting-area">
            <div class="chip-toolbar">
              <span class="muted">Chip:</span>
              <button class="chip-btn active" data-chip="1">1</button>
              <button class="chip-btn" data-chip="5">5</button>
              <button class="chip-btn" data-chip="10">10</button>
              <button class="chip-btn" data-chip="25">25</button>
              <button class="chip-btn" data-chip="100">100</button>
              <button class="btn ghost" id="clear-bets">Einsätze löschen</button>
            </div>
            <div class="betting-mat" id="betting-mat" aria-label="Setzfeld"></div>
            <div class="mat-caption">Tipp: Klicke auf ein Feld, um Chips zu platzieren. Oder nutze die Auswahl oben.</div>
          </div>
          <div class="wheel-side">
            <div class="wheel-wrapper" style="display:flex;justify-content:center;">
              <div class="wheel" id="wheel-vis" aria-label="Roulette-Rad" style="width:340px;height:340px;position:relative;border-radius:50%;background:radial-gradient(circle,#d4c097,#b8913f 70%);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 18px rgba(0,0,0,.4);"></div>
            </div>
          </div>
        </div>
      </section>
      <canvas id="fx-canvas"></canvas>
    </main>
    <script>
      'use strict';
      const $ = (s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s)); const fmt=(n)=>`$${Number(n).toLocaleString()}`;
      const BANK_KEY='casino_bankroll_v1'; const START_BANK=1000; let bankroll=loadBank(); const bankrollEl=$('#bankroll');
      function loadBank(){ try{ const n=Number(localStorage.getItem(BANK_KEY)); if(Number.isFinite(n)&&n>=0) return Math.floor(n);}catch{} return START_BANK; }
      function saveBank(){ try{ localStorage.setItem(BANK_KEY, String(bankroll)); }catch{} }
      function credit(delta){ bankroll=Math.max(0, bankroll+delta); bankrollEl.textContent=fmt(bankroll); bankrollEl.classList.remove('flash-up','flash-down'); void bankrollEl.offsetWidth; bankrollEl.classList.add(delta>=0?'flash-up':'flash-down'); saveBank(); }
      credit(0);
      $('#reset-bank').addEventListener('click', ()=>{ bankroll=START_BANK; credit(0); Sound.play('click'); });
      $('#motion-toggle').addEventListener('click', ()=>{ document.body.classList.toggle('reduce-motion'); });

      const MUTE_KEY='casino_mute_v1'; const MuteBtn=$('#mute-toggle');
      const Sound=(()=>{ let ctx=null; let muted=(function(){ try{ return localStorage.getItem(MUTE_KEY)==='1'; }catch{} return false; })();
        function saveMute(){ try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch{} }
        function ensure(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; try{ ctx=new AC(); }catch{} } }
        function envGain(g){ const gain=ctx.createGain(); gain.gain.value=g; gain.connect(ctx.destination); return gain; }
        function tone(f=440,d=0.12,t='sine',v=0.05){ if(muted||!ctx) return; const o=ctx.createOscillator(); const g=envGain(v); o.type=t; o.frequency.value=f; o.connect(g); const tt=ctx.currentTime; o.start(tt); o.stop(tt+d); }
        function click(){ tone(660,0.06,'square',0.03) } function win(){ tone(880,0.1,'sine',0.06); setTimeout(()=>tone(1320,0.12,'sine',0.06),90)} function lose(){ tone(220,0.18,'sawtooth',0.05) }
        function update(){ MuteBtn.setAttribute('aria-pressed', muted?'true':'false'); MuteBtn.textContent = muted?'🔇':'🔊'; }
        update();
        return { toggle(){ ensure(); muted=!muted; saveMute(); update(); }, play(n){ ensure(); if(muted) return; if(n==='click') click(); else if(n==='win') win(); else if(n==='lose') lose(); } };
      })();
      MuteBtn.addEventListener('click', ()=>Sound.toggle());

      const fxCanvas=$('#fx-canvas');
      const FX=(()=>{ const ctx=fxCanvas.getContext('2d'); let ps=[]; let running=false; let raf=0; function resize(){ const r=fxCanvas.getBoundingClientRect(); fxCanvas.width=Math.floor(r.width*devicePixelRatio); fxCanvas.height=Math.floor(r.height*devicePixelRatio);} window.addEventListener('resize',resize); resize(); function randColor(){ const cs=['#22d3ee','#0ea5e9','#10b981','#f59e0b','#ef4444','#eab308','#a78bfa','#f472b6']; return cs[Math.floor(Math.random()*cs.length)]; } function spawn(n=120){ const w=fxCanvas.width,h=fxCanvas.height; for(let i=0;i<n;i++){ ps.push({ x:w/2+(Math.random()*w/3-w/6), y:-20*devicePixelRatio, vx:(Math.random()-0.5)*3*devicePixelRatio, vy:(2+Math.random()*2)*devicePixelRatio, g:0.08*devicePixelRatio, s:(2+Math.random()*3)*devicePixelRatio, c:randColor(), a:1, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2 }); } } function step(){ if(!running) return; const w=fxCanvas.width,h=fxCanvas.height; ctx.clearRect(0,0,w,h); ps.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a=Math.max(0,p.a-0.005); ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s); ctx.restore(); }); ps=ps.filter(p=>p.y<h+40&&p.a>0.01); if(ps.length===0){ running=false; cancelAnimationFrame(raf); return; } raf=requestAnimationFrame(step);} function burst(intensity=1){ resize(); spawn(Math.floor(120*intensity)); if(!running){ running=true; step(); } } return { burst }; })();

      // Roulette logic
      const betIn=$('#rl-bet'), typeSel=$('#rl-type'), numberWrap=$('#rl-number-wrap'), numberIn=$('#rl-number');
      const spinBtn=$('#rl-spin'), outEl=$('#rl-result'), colorEl=$('#rl-color'), msg=$('#rl-msg'), wheel=$('#rl-wheel');
      
  // (Wheel removed)
      
      // --- Betting mat ---
      // --- Betting mat logic (restored) ---
      typeSel.addEventListener('change', ()=>{ numberWrap.hidden = typeSel.value!=='number'; });
      const bettingMat=$('#betting-mat');
      const chipToolbarBtns=$$('.chip-btn');
      const clearBetsBtn=$('#clear-bets');
      let currentChip=1;
      chipToolbarBtns.forEach(b=>{
        b.addEventListener('click',()=>{
          chipToolbarBtns.forEach(x=>x.classList.remove('active'));
            b.classList.add('active');
            currentChip=Number(b.dataset.chip||'1');
            betIn.value=String(currentChip);
            Sound.play('click');
        });
      });
      function matCell(label, cls='', attrs={}){ const d=document.createElement('div'); d.className=`cell ${cls}`.trim(); d.textContent=label; Object.entries(attrs).forEach(([k,v])=>d.setAttribute(k,v)); return d; }
  function isRed(n){ return n!==0 && (n % 2 === 1); }
      function createMat(){
        if(!bettingMat) return;
        // Column 0: zero spanning 3 rows
        const zero=matCell('0','zero outside',{'data-bet':'number','data-key':'0'}); bettingMat.appendChild(zero);
        // Left-to-right ascending rows instead of bottom-to-top column grouping
        const grid=[
          Array.from({length:12},(_,i)=>1+i),        // 1..12
          Array.from({length:12},(_,i)=>13+i),       // 13..24
          Array.from({length:12},(_,i)=>25+i)        // 25..36
        ];
        for(let r=0; r<3; r++){
          for(let c=0; c<12; c++){
            const n=grid[r][c];
            const cls = (n===0)?'zero':(isRed(n)?'red':'black');
            const cell = matCell(String(n), cls, { 'data-bet':'number', 'data-key':String(n) });
            bettingMat.appendChild(cell);
          }
        }
        const outs=[
          {label:'1st 12', bet:'dozen', key:'1', span:4},
          {label:'2nd 12', bet:'dozen', key:'2', span:4},
          {label:'3rd 12', bet:'dozen', key:'3', span:4},
          {label:'1-18', bet:'low', key:'low', span:2},
          {label:'EVEN', bet:'even', key:'even', span:2},
          {label:'ROT', bet:'color', key:'red', span:2},
          {label:'SCHWARZ', bet:'color', key:'black', span:2},
          {label:'ODD', bet:'odd', key:'odd', span:2},
          {label:'19-36', bet:'high', key:'high', span:2},
        ];
        outs.forEach(o=>{
          const d=matCell(o.label,'outside',{'data-bet':o.bet,'data-key':o.key, style:`grid-column: span ${o.span}`}); bettingMat.appendChild(d);
        });
      }
      createMat();
      const betMap=new Map(); // key -> {type,key,amount,el}
      function betKey(type,key){ return `${type}:${key}`; }
      function pop(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),350); }
      function placeChipOn(cell, type, key, amt){
        const k=betKey(type,key);
        const existing=betMap.get(k);
        if(existing){ existing.amount += amt; const s=existing.el.querySelector('.stack'); if(s) s.textContent = fmt(existing.amount); pop(existing.el); return; }
        const wrap=document.createElement('div'); wrap.className='chip-wrap'; wrap.style.position='absolute'; wrap.style.inset='0';
        const chip=document.createElement('div'); chip.className='chip'; chip.textContent=amt; wrap.appendChild(chip);
        const stack=document.createElement('div'); stack.className='stack'; stack.textContent=fmt(amt); wrap.appendChild(stack);
        cell.appendChild(wrap);
        betMap.set(k,{type,key,amount:amt,el:wrap});
        pop(chip);
      }
      function clearBets(){ betMap.forEach(b=>b.el.remove()); betMap.clear(); }
      if(clearBetsBtn) clearBetsBtn.addEventListener('click',()=>{ clearBets(); Sound.play('click'); });
      if(bettingMat) bettingMat.addEventListener('click', (e)=>{
        const cell=e.target.closest('.cell'); if(!cell) return;
        const type=cell.getAttribute('data-bet'); const key=cell.getAttribute('data-key'); if(!type||!key) return;
        const amt=currentChip;
        if(amt<1) return; if(amt>bankroll){ msg.textContent='Zu wenig Guthaben für diesen Einsatz.'; return; }
        placeChipOn(cell, type, key, amt);
      });
      function totalPlacedBet(){ let t=0; betMap.forEach(b=> t+=b.amount); return t; }
      function resolvePayout(n){
        const c=color(n); let win=0;
        betMap.forEach(b=>{
          const amt=b.amount; const t=b.type; const k=b.key;
          if(t==='number'){ const target=Number(k); if(target===n) win += amt*36; }
          else if(t==='color'){ if(n!==0 && ((k==='red'&&c==='rot')||(k==='black'&&c==='schwarz'))) win += amt*2; }
          else if(t==='even'){ if(n!==0 && (n%2===0)) win += amt*2; }
          else if(t==='odd'){ if(n!==0 && (n%2===1)) win += amt*2; }
          else if(t==='low'){ if(n>=1 && n<=18) win += amt*2; }
          else if(t==='high'){ if(n>=19 && n<=36) win += amt*2; }
          else if(t==='dozen'){ const d=Number(k); if(d===1 && n>=1&&n<=12) win+=amt*3; else if(d===2 && n>=13&&n<=24) win+=amt*3; else if(d===3 && n>=25&&n<=36) win+=amt*3; }
        });
        return win;
      }
  function color(n){ if(n===0) return 'grün'; return (n % 2 === 1) ? 'rot' : 'schwarz'; }
      function spin(){ return Math.floor(Math.random()*37); }
      // Build animated wheel (0 green, odd red, even black)
  // Sequential order 0..36 for equal sectors
  const WHEEL_ORDER=Array.from({length:37},(_,i)=>i);
      const wheelVis=$('#wheel-vis');
      function buildWheel(){
        if(!wheelVis) return;
        const seg=360/37; wheelVis.innerHTML='';
        // Solid base color dial
  const dial=document.createElement('div'); dial.className='dial'; dial.style.cssText='position:absolute;inset:0;border-radius:50%;background:#1d2a36;box-shadow:inset 0 0 18px rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.4);overflow:hidden;';
  // Refined spokes: thinner, softer, with subtle blur ring
  const spokes=document.createElement('div'); spokes.style.cssText='position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.55) 0deg, rgba(255,255,255,.55) 0.7deg, transparent 0.7deg, transparent 9.73deg);mix-blend-mode:screen;pointer-events:none;'; dial.appendChild(spokes);
  const blurRing=document.createElement('div'); blurRing.style.cssText='position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.12) 0 40%, transparent 45% 100%);pointer-events:none;'; dial.appendChild(blurRing);
  const innerGlow=document.createElement('div'); innerGlow.style.cssText='position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.10), transparent 65%);pointer-events:none;'; dial.appendChild(innerGlow);
  // Center hub to hide aliasing convergence
  const hub=document.createElement('div'); hub.style.cssText='position:absolute;top:50%;left:50%;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#223445 0%, #182632 70%);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 6px rgba(0,0,0,.6);pointer-events:none;'; dial.appendChild(hub);
        wheelVis.appendChild(dial);
        // Number ring (0..36)
        const nums=document.createElement('div'); nums.className='nums'; nums.style.cssText='position:absolute;inset:0;border-radius:50%;pointer-events:none;font-size:13px;font-weight:700;color:#e5e7eb;text-shadow:0 1px 2px rgba(0,0,0,.65);';
        const radius=140;
        for(let i=0;i<WHEEL_ORDER.length;i++){
          const n=WHEEL_ORDER[i];
          const a=-90 + (i+0.5)*seg; // center of sector
          const el=document.createElement('div');
          el.textContent=String(n);
          el.style.cssText=`position:absolute;top:50%;left:50%;transform:rotate(${a}deg) translateY(-${radius}px) rotate(${-a}deg) translate(-50%,-50%);width:26px;height:22px;display:flex;align-items:center;justify-content:center;`;
          nums.appendChild(el);
        }
        dial.appendChild(nums);
        const pointer=document.createElement('div'); pointer.style.cssText='position:absolute;bottom:-10px;left:50%;transform:translateX(-50%) rotate(180deg);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:18px solid #ffd166;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.5));z-index:20;'; wheelVis.appendChild(pointer);
      }
      buildWheel();
      let wheelRot=0;
      function spinWheelTo(n){
        const seg=360/37; const idx=WHEEL_ORDER.indexOf(n); const pocketAngle= -(idx+0.5)*seg; const minTurns=6; let target=pocketAngle;
        while((target-wheelRot) > (-minTurns*360)) target-=360;
        if((target-wheelRot) >=0) target -= 360*(minTurns+1);
        wheelRot=target;
        const dial=wheelVis.querySelector('.dial'); const nums=dial?dial.querySelector('.nums'):null; const dur=1400;
        if(dial){
          dial.style.willChange='transform';
          dial.style.transition=`transform ${dur}ms cubic-bezier(.15,.7,.1,1)`;
          requestAnimationFrame(()=>{ dial.style.transform=`rotate(${wheelRot}deg)`; });
        }
        return new Promise(res=> setTimeout(()=>{
          // highlight landed number
          if(nums){
            nums.querySelectorAll('div').forEach(d=>d.style.background='');
            const landed=nums.querySelectorAll('div')[idx];
            if(landed){ landed.style.background='rgba(255,255,255,.12)'; landed.style.borderRadius='4px'; setTimeout(()=>{ landed.style.background=''; },1200); }
          }
          res();
        },dur+60));
      }

      spinBtn.addEventListener('click', async ()=>{
  const placedTotal= totalPlacedBet();
  const usingMat = placedTotal>0;
  const upfrontBet = usingMat ? placedTotal : Math.max(1, Math.floor(Number(betIn.value)||0));
  if(upfrontBet>bankroll){ msg.textContent='Zu wenig Guthaben.'; return; }
  credit(-upfrontBet);
        // UI disable
        wheel.classList.add('hide'); outEl.textContent='–'; colorEl.textContent='–'; msg.textContent='Dreht…';
        spinBtn.disabled=true; betIn.disabled=true; typeSel.disabled=true; numberIn.disabled=true;

        // Decide result, animate wheel
        const n = spin(); const c = color(n);
        await spinWheelTo(n);
        
        // Resolve
        outEl.textContent=String(n); outEl.classList.add('pop'); setTimeout(()=>outEl.classList.remove('pop'), 400);
        colorEl.textContent=c; 
        let win=0;
        if(usingMat){
          win = resolvePayout(n);
        } else {
          const type = typeSel.value; const pick = Math.floor(Number(numberIn.value)||0);
          if(type==='red' && c==='rot') win=upfrontBet*2; else if(type==='black' && c==='schwarz') win=upfrontBet*2; else if(type==='odd' && n!==0 && (n%2===1)) win=upfrontBet*2; else if(type==='even' && n!==0 && (n%2===0)) win=upfrontBet*2; else if(type==='number' && pick===n) win=upfrontBet*36;
        }
        if(win>0){ credit(win); msg.textContent='Gewinn '+fmt(win-upfrontBet)+' (Auszahlung '+fmt(win)+')'; if(!usingMat || win>=36){ FX.burst(1.2); } Sound.play('win'); }
        else { msg.textContent='Verlust.'; Sound.play('lose'); }
        if(usingMat){ clearBets(); }
        spinBtn.disabled=false; betIn.disabled=false; typeSel.disabled=false; numberIn.disabled=false; if(clearBetsBtn) clearBetsBtn.disabled=false; if(bettingMat) bettingMat.style.pointerEvents='';
      });
    </script>
  </body>
</html>
