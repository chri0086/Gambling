<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice</title>
    <style>
      :root { --bg:#0a0f12; --panel:#0e1520; --muted:#9aa4b2; --text:#e6edf3; --accent:#22d3ee; --accent-2:#0ea5e9; --danger:#ef4444; --ok:#10b981; --gold:#ffd166; }
      *{box-sizing:border-box}
      html, body { height: 100%; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: radial-gradient(1200px 800px at 50% -10%, #0e1b2a, #081018 60%, #050a10 100%); color: var(--text); }
      body.reduce-motion * { animation: none !important; transition: none !important; }

      .topbar { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.06); background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)); position: sticky; top: 0; backdrop-filter: blur(6px); }
      .brand { font-weight:800; display:flex; align-items:center; gap:8px }
      .brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent) }
      .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .nav a { color: var(--text); text-decoration:none; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
      .nav a:hover { background: rgba(255,255,255,.06); }
      .nav a.active { background: linear-gradient(180deg, rgba(34,211,238,.15), rgba(14,165,233,.1)); border-color: rgba(34,211,238,.25); }
      .balance { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:12px; }
      .balance .amount { color: var(--gold); font-weight:800; }

      main { padding: 16px; display:grid; gap:16px; position: relative; max-width: 900px; margin: 0 auto; }
      .panel { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; }
      .controls { display:flex; gap: 10px; flex-wrap:wrap; align-items:center }
      .input { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); color: var(--text); padding:8px 10px; border-radius:10px }
      .btn { background: var(--accent-2); color:#001018; border: none; padding: 10px 14px; border-radius:10px; font-weight:700; cursor:pointer; box-shadow: 0 6px 16px rgba(14,165,233,.35) }
      .btn:hover { filter: brightness(1.06) }
      .btn:disabled { opacity:.5; cursor:not-allowed }
      .btn.gold { background: linear-gradient(180deg, #ffd166, #ffb703); color: #1f2937; box-shadow: 0 6px 16px rgba(255,183,3,.25) }
      .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.12); color: var(--text); }
      .muted { color: var(--muted); }
      .msg { min-height:20px; font-weight:700 }
      .badge { padding:2px 8px; border-radius:999px; background: rgba(255,255,255,0.08); font-size:12px }
      .shake { animation: shake 500ms ease-in-out; }
      @keyframes shake { 0%,100%{ transform:translateX(0) } 20%{ transform:translateX(-4px) } 40%{ transform:translateX(4px) } 60%{ transform:translateX(-3px) } 80%{ transform:translateX(3px) } }

      /* balance flash */
      .amount.flash-up { animation: amtUp 750ms ease-out; }
      .amount.flash-down { animation: amtDown 750ms ease-out; }
      @keyframes amtUp { 0%{ color:#fff } 20%{ color:#10b981; transform: scale(1.08) } 100%{ color: var(--gold); transform: scale(1) } }
      @keyframes amtDown { 0%{ color:#fff } 20%{ color:#ef4444; transform: scale(0.96) } 100%{ color: var(--gold); transform: scale(1) } }

      #fx-canvas{ position:absolute; inset:0; pointer-events:none }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="dot"></span> <span>Dice</span></div>
      <nav class="nav">
        <a href="index.html">Blackjack</a>
        <a href="roulette.html">Roulette</a>
        <a href="slots.html">Slots</a>
        <a href="dice.html" class="active">Dice</a>
        <a href="crash.html">Crash</a>
      </nav>
      <div class="balance">
        <span>Guthaben:</span>
        <span class="amount" id="bankroll">$1,000</span>
        <button class="btn" id="reset-bank">Reset</button>
        <button class="btn" id="mute-toggle" aria-pressed="false" title="Ton an/aus">🔊</button>
        <button class="btn ghost" id="motion-toggle" title="Animationen reduzieren">Motion</button>
      </div>
    </header>
    <main>
      <section class="panel" id="game-dice">
        <h3>Dice</h3>
        <div class="controls">
          <label>Einsatz ($): <input type="number" id="dc-bet" class="input" value="5" min="1" step="1"/></label>
          <label>Gewinnchance (%): <input type="number" id="dc-chance" class="input" value="50" min="1" max="95"/></label>
          <button class="btn gold" id="dc-roll">Roll</button>
        </div>
        <div>Wurf: <span class="badge" id="dc-roll-out">–</span> • Erwartete Auszahlung: <span class="badge" id="dc-quote">–</span></div>
        <div class="msg" id="dc-msg"></div>
        <div class="muted">Quote ~ (0.99 / Chance) • House-Edge ~1%</div>
      </section>
      <canvas id="fx-canvas"></canvas>
    </main>
    <script>
      'use strict';
      const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s)); const fmt=(n)=>`$${Number(n).toLocaleString()}`;
  const BANK_KEY='casino_bankroll_v1'; const START_BANK=1000; let bankroll=loadBank(); const bankrollEl=$('#bankroll');
  const BUS = ('BroadcastChannel' in window) ? new BroadcastChannel('casino_bankroll_bus') : null;
  function loadBank(){ try{ const n=Number(localStorage.getItem(BANK_KEY)); if(Number.isFinite(n)&&n>=0) return Math.floor(n);}catch{} return START_BANK; }
  function saveBank(){ try{ localStorage.setItem(BANK_KEY, String(bankroll)); }catch{} }
  function updateBankEl(){ bankrollEl.textContent = fmt(bankroll); }
  function broadcastBank(){ try{ BUS && BUS.postMessage({ t:'bank', v: bankroll }); }catch{} }
  function credit(delta){ bankroll=Math.max(0, bankroll+delta); updateBankEl(); bankrollEl.classList.remove('flash-up','flash-down'); void bankrollEl.offsetWidth; bankrollEl.classList.add(delta>=0?'flash-up':'flash-down'); saveBank(); broadcastBank(); }
  window.addEventListener('storage', (e)=>{ if(e.key===BANK_KEY){ const n=Number(e.newValue||''); if(Number.isFinite(n)){ bankroll = Math.max(0, Math.floor(n)); updateBankEl(); } } });
  if(BUS){ BUS.addEventListener('message', (ev)=>{ const d=ev.data; if(d && d.t==='bank'){ const n=Number(d.v); if(Number.isFinite(n) && n!==bankroll){ bankroll = Math.max(0, Math.floor(n)); updateBankEl(); } } }); }
  credit(0);
      $('#reset-bank').addEventListener('click', ()=>{ bankroll=START_BANK; credit(0); Sound.play('click'); });
      $('#motion-toggle').addEventListener('click', ()=>{ document.body.classList.toggle('reduce-motion'); });

      const MUTE_KEY='casino_mute_v1'; const MuteBtn=$('#mute-toggle');
      const Sound=(()=>{ let ctx=null; let muted=(function(){ try{ return localStorage.getItem(MUTE_KEY)==='1'; }catch{} return false; })(); function saveMute(){ try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch{} } function ensure(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; try{ ctx=new AC(); }catch{} } } function envGain(g){ const gain=ctx.createGain(); gain.gain.value=g; gain.connect(ctx.destination); return gain; } function tone(f=440,d=0.12,t='sine',v=0.05){ if(muted||!ctx) return; const o=ctx.createOscillator(); const g=envGain(v); o.type=t; o.frequency.value=f; o.connect(g); const tt=ctx.currentTime; o.start(tt); o.stop(tt+d); } function click(){ tone(660,0.06,'square',0.03) } function win(){ tone(880,0.1,'sine',0.06); setTimeout(()=>tone(1320,0.12,'sine',0.06),90)} function lose(){ tone(220,0.18,'sawtooth',0.05) } function update(){ MuteBtn.setAttribute('aria-pressed', muted?'true':'false'); MuteBtn.textContent = muted?'🔇':'🔊'; } update(); return { toggle(){ ensure(); muted=!muted; saveMute(); update(); }, play(n){ ensure(); if(muted) return; if(n==='click') click(); else if(n==='win') win(); else if(n==='lose') lose(); } }; })();
      MuteBtn.addEventListener('click', ()=>Sound.toggle());

      const fxCanvas=$('#fx-canvas');
      const FX=(()=>{ const ctx=fxCanvas.getContext('2d'); let ps=[]; let running=false; let raf=0; function resize(){ const r=fxCanvas.getBoundingClientRect(); fxCanvas.width=Math.floor(r.width*devicePixelRatio); fxCanvas.height=Math.floor(r.height*devicePixelRatio);} window.addEventListener('resize',resize); resize(); function randColor(){ const cs=['#22d3ee','#0ea5e9','#10b981','#f59e0b','#ef4444','#eab308','#a78bfa','#f472b6']; return cs[Math.floor(Math.random()*cs.length)]; } function spawn(n=120){ const w=fxCanvas.width,h=fxCanvas.height; for(let i=0;i<n;i++){ ps.push({ x:w/2+(Math.random()*w/3-w/6), y:-20*devicePixelRatio, vx:(Math.random()-0.5)*3*devicePixelRatio, vy:(2+Math.random()*2)*devicePixelRatio, g:0.08*devicePixelRatio, s:(2+Math.random()*3)*devicePixelRatio, c:randColor(), a:1, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2 }); } } function step(){ if(!running) return; const w=fxCanvas.width,h=fxCanvas.height; ctx.clearRect(0,0,w,h); ps.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a=Math.max(0,p.a-0.005); ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s); ctx.restore(); }); ps=ps.filter(p=>p.y<h+40&&p.a>0.01); if(ps.length===0){ running=false; cancelAnimationFrame(raf); return; } raf=requestAnimationFrame(step);} function burst(intensity=1){ resize(); spawn(Math.floor(120*intensity)); if(!running){ running=true; step(); } } return { burst }; })();

      // Dice logic
      const betIn=$('#dc-bet'); const chanceIn=$('#dc-chance'); const rollBtn=$('#dc-roll'); const outEl=$('#dc-roll-out'); const quoteEl=$('#dc-quote'); const msg=$('#dc-msg');
      function updateQuote(){ const ch=Math.min(95, Math.max(1, Number(chanceIn.value)||50)); const q = 0.99 / (ch/100); quoteEl.textContent = q.toFixed(2)+'x'; }
      chanceIn.addEventListener('input', updateQuote); updateQuote();
      rollBtn.addEventListener('click', ()=>{
        const bet=Math.max(1, Math.floor(Number(betIn.value)||0)); const ch=Math.min(95, Math.max(1, Number(chanceIn.value)||50)); if(bet>bankroll){ msg.textContent='Zu wenig Guthaben.'; return; }
        credit(-bet); Sound.play('click');
        rollBtn.disabled=true; betIn.disabled=true; chanceIn.disabled=true; msg.textContent='Würfelt…'; outEl.classList.add('shake');
        let t=0; const it = setInterval(()=>{ const tmp = (Math.random()*100).toFixed(2)+'%'; outEl.textContent=tmp; if((t+=80)>=800){ clearInterval(it); outEl.classList.remove('shake');
            const r = Math.random()*100; outEl.textContent=r.toFixed(2)+'%'; const win = r < ch; const mult = 0.99/(ch/100);
            if(win){ const payout = Math.floor(bet*mult); credit(payout); msg.textContent='Gewinn '+fmt(payout-bet)+' ('+mult.toFixed(2)+'x)'; Sound.play('win'); if(mult>=4) FX.burst(0.9); } else { msg.textContent='Verlust.'; Sound.play('lose'); }
            rollBtn.disabled=false; betIn.disabled=false; chanceIn.disabled=false;
        } }, 80);
      });
    </script>
  </body>
</html>
